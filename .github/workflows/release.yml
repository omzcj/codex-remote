name: Release

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - codex-remote
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    uses: omzcj/release-ci/.github/workflows/source-release.yml@9e6c5af26117fd344905d93a0e16be0bbf4e62c5
    with:
      runner: macos-15
      project-name: codex-remote
      validate-command: ./tests/test.sh
      package-paths: |
        VERSION
        LICENSE
        codex-remote
